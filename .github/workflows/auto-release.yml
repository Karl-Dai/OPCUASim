name: Auto Release

# Runs daily at Beijing 00:00 (16:00 UTC). If master has commits newer
# than the latest v* tag, scripts/auto-release.sh bumps the version,
# writes the CHANGELOG section, commits, tags and pushes — which in turn
# triggers the release.yml build/publish workflow.
#
# Also triggerable manually from the Actions tab: "Run workflow".

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 08:00 CST? No: 16:00 UTC = 00:00 Beijing (UTC+8)
  workflow_dispatch:

permissions:
  contents: write   # needed to commit + tag + push; GITHUB_TOKEN is read-only by default

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags for version detection
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Fast cache for the Cargo.lock sync inside the script.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run auto release
        run: bash scripts/auto-release.sh
        env:
          # When GITHUB_TOKEN is not permitted to push (e.g. org policy),
          # configure a PAT with `contents: write` as AUTO_RELEASE_TOKEN.
          AUTO_RELEASE_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}